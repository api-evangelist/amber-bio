aid: amber-bio
name: Amber Bio
description: 'Amber Bio is a San Francisco biotechnology company developing an RNA-based
  gene-editing platform capable of making multi-kilobase edits — rewriting thousands
  of bases on a single RNA strand in one step — to reach previously undruggable patient
  populations. Because edited RNA eventually degrades in the body, the approach is
  designed to be safer and reversible compared with permanent DNA editing. The platform
  pairs multi-kilobase RNA writing with AI foundation models to target diverse pathogenic
  variants across patients with a single product, initially focused on ophthalmology
  and central nervous system diseases. Founded by CRISPR-field researchers from the
  Broad Institute and UC Berkeley (co-founder and CTO Basem Al-Shayeb, advised by Nobel
  Laureate Jennifer Doudna), Amber Bio launched in 2023 with a $26M seed round co-led
  by Playground Global and Andreessen Horowitz. It has no public developer API; this
  API Evangelist profile tracks the company as a portfolio lead.'
